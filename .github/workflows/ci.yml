name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: pip install uv==0.11.32
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: make gate

  deploy:
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/meridian'
    runs-on: ubuntu-latest
    concurrency: railway-production
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no Railway token is configured
        id: token
        env:
          HAS_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::RAILWAY_TOKEN repo secret is not set; deploy skipped (use scripts/deploy.sh)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        run: npm install -g @railway/cli@5.70.0
      - if: steps.token.outputs.present == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service meridian --environment production
