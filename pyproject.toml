[project]
name = "meridian"
version = "0.1.0"
description = "Meridian AI agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.146.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.14.0",
    "ruff==0.17.1",
    "pyright==1.1.414",
    "pip-audit==2.10.1",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["analysis", "docs", "data"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
